[project]
name = "salu"
version = "0.1.0"
description = "SALU - personal AI assistant (Phase 1: core)"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.160",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "psutil>=6.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
salu = "salu.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["salu*"]

[tool.setuptools.package-data]
salu = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: calls the real Claude backend (uses subscription quota); run with -m live"]
addopts = "-m 'not live'"
